<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 발음 연습기 - Japanese Pronunciation Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .section-title {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        /* Practice Sentence Section */
        .practice-section {
            margin-bottom: 30px;
        }

        .sentence-display {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .japanese-text {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .romaji-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 5px;
        }

        .meaning-text {
            font-size: 1em;
            color: #888;
        }

        .sentence-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .nav-btn.prev {
            background: #e0e0e0;
            color: #333;
        }

        .nav-btn.next {
            background: #667eea;
            color: white;
        }

        .nav-btn:hover {
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Recording Section */
        .record-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 2.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .record-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.6);
        }

        .record-btn.recording {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0); }
        }

        .record-status {
            font-size: 1.1em;
            color: #666;
        }

        .record-status.recording {
            color: #f5576c;
            font-weight: bold;
        }

        /* Result Section */
        .result-section {
            margin-bottom: 20px;
        }

        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            min-height: 80px;
        }

        .result-label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 1.8em;
            color: #333;
            word-break: break-all;
        }

        .result-text.success {
            color: #28a745;
        }

        .result-text.partial {
            color: #ffc107;
        }

        .result-text.error {
            color: #dc3545;
        }

        /* Feedback Section */
        .feedback-section {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .feedback-section.success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .feedback-section.partial {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: white;
        }

        .feedback-section.error {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
        }

        .feedback-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .feedback-text {
            font-size: 1.2em;
        }

        /* Category Selection */
        .category-section {
            margin-bottom: 20px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-btn {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .category-btn:hover {
            background: #667eea;
            color: white;
        }

        /* Custom Input */
        .custom-section {
            margin-top: 20px;
        }

        .custom-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.2em;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
        }

        .custom-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .custom-btn {
            padding: 12px 25px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .custom-btn:hover {
            background: #5a3580;
            transform: scale(1.05);
        }

        /* Error Message */
        .error-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #856404;
        }

        /* Progress */
        .progress-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .progress-text {
            font-size: 0.9em;
            color: #666;
        }

        /* Footer */
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8em;
            }

            .main-card {
                padding: 20px;
            }

            .japanese-text {
                font-size: 1.8em;
            }

            .record-btn {
                width: 100px;
                height: 100px;
                font-size: 2em;
            }

            .result-text {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>일본어 발음 연습기</h1>
            <p class="subtitle">Japanese Pronunciation Checker</p>
        </header>

        <div class="main-card">
            <!-- Category Selection -->
            <div class="category-section">
                <h2 class="section-title">연습 카테고리</h2>
                <div class="category-buttons">
                    <button class="category-btn active" data-category="greetings">인사말</button>
                    <button class="category-btn" data-category="numbers">숫자</button>
                    <button class="category-btn" data-category="daily">일상회화</button>
                    <button class="category-btn" data-category="travel">여행</button>
                    <button class="category-btn" data-category="food">음식</button>
                </div>
            </div>

            <!-- Practice Sentence -->
            <div class="practice-section">
                <h2 class="section-title">연습 문장</h2>
                <div class="sentence-display">
                    <div class="japanese-text" id="japaneseText">こんにちは</div>
                    <div class="romaji-text" id="romajiText">Konnichiwa</div>
                    <div class="meaning-text" id="meaningText">안녕하세요</div>
                </div>
                <div class="sentence-nav">
                    <button class="nav-btn prev" id="prevBtn">◀ 이전</button>
                    <button class="nav-btn next" id="nextBtn">다음 ▶</button>
                </div>
            </div>

            <!-- Recording -->
            <div class="record-section">
                <button class="record-btn" id="recordBtn">🎤</button>
                <p class="record-status" id="recordStatus">버튼을 누르고 발음하세요</p>
            </div>

            <!-- Result -->
            <div class="result-section">
                <h2 class="section-title">인식 결과</h2>
                <div class="result-box">
                    <p class="result-label">당신의 발음:</p>
                    <p class="result-text" id="resultText">-</p>
                </div>
            </div>

            <!-- Feedback -->
            <div class="feedback-section" id="feedbackSection" style="display: none;">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <p class="feedback-text" id="feedbackText"></p>
            </div>

            <!-- Custom Input -->
            <div class="custom-section">
                <h2 class="section-title">직접 입력</h2>
                <input type="text" class="custom-input" id="customInput" placeholder="연습하고 싶은 일본어를 입력하세요">
                <button class="custom-btn" id="customBtn">이 문장 연습하기</button>
            </div>

            <!-- Progress -->
            <div class="progress-section">
                <p class="progress-text" id="progressText">문장 1 / 5</p>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <footer>
            <p>Web Speech API를 사용합니다. Chrome 브라우저를 권장합니다.</p>
        </footer>
    </div>

    <script>
        // Practice sentences data
        const sentences = {
            greetings: [
                { japanese: 'こんにちは', romaji: 'Konnichiwa', meaning: '안녕하세요' },
                { japanese: 'おはようございます', romaji: 'Ohayou gozaimasu', meaning: '좋은 아침입니다' },
                { japanese: 'こんばんは', romaji: 'Konbanwa', meaning: '안녕하세요 (저녁)' },
                { japanese: 'ありがとうございます', romaji: 'Arigatou gozaimasu', meaning: '감사합니다' },
                { japanese: 'すみません', romaji: 'Sumimasen', meaning: '실례합니다 / 죄송합니다' },
                { japanese: 'はじめまして', romaji: 'Hajimemashite', meaning: '처음 뵙겠습니다' },
                { japanese: 'よろしくお願いします', romaji: 'Yoroshiku onegaishimasu', meaning: '잘 부탁드립니다' },
                { japanese: 'さようなら', romaji: 'Sayounara', meaning: '안녕히 가세요' },
                { japanese: 'おやすみなさい', romaji: 'Oyasuminasai', meaning: '안녕히 주무세요' },
                { japanese: 'いただきます', romaji: 'Itadakimasu', meaning: '잘 먹겠습니다' }
            ],
            numbers: [
                { japanese: 'いち', romaji: 'Ichi', meaning: '1 (하나)' },
                { japanese: 'に', romaji: 'Ni', meaning: '2 (둘)' },
                { japanese: 'さん', romaji: 'San', meaning: '3 (셋)' },
                { japanese: 'よん', romaji: 'Yon', meaning: '4 (넷)' },
                { japanese: 'ご', romaji: 'Go', meaning: '5 (다섯)' },
                { japanese: 'ろく', romaji: 'Roku', meaning: '6 (여섯)' },
                { japanese: 'なな', romaji: 'Nana', meaning: '7 (일곱)' },
                { japanese: 'はち', romaji: 'Hachi', meaning: '8 (여덟)' },
                { japanese: 'きゅう', romaji: 'Kyuu', meaning: '9 (아홉)' },
                { japanese: 'じゅう', romaji: 'Juu', meaning: '10 (열)' }
            ],
            daily: [
                { japanese: 'お元気ですか', romaji: 'Ogenki desu ka', meaning: '잘 지내세요?' },
                { japanese: '私は韓国人です', romaji: 'Watashi wa kankokujin desu', meaning: '저는 한국인입니다' },
                { japanese: '日本語を勉強しています', romaji: 'Nihongo wo benkyou shiteimasu', meaning: '일본어를 공부하고 있습니다' },
                { japanese: 'わかりません', romaji: 'Wakarimasen', meaning: '모르겠습니다' },
                { japanese: 'もう一度お願いします', romaji: 'Mou ichido onegaishimasu', meaning: '다시 한 번 부탁합니다' },
                { japanese: 'ゆっくり話してください', romaji: 'Yukkuri hanashite kudasai', meaning: '천천히 말해주세요' },
                { japanese: 'これは何ですか', romaji: 'Kore wa nan desu ka', meaning: '이것은 무엇입니까?' },
                { japanese: '今何時ですか', romaji: 'Ima nanji desu ka', meaning: '지금 몇 시입니까?' }
            ],
            travel: [
                { japanese: '駅はどこですか', romaji: 'Eki wa doko desu ka', meaning: '역은 어디입니까?' },
                { japanese: 'いくらですか', romaji: 'Ikura desu ka', meaning: '얼마입니까?' },
                { japanese: 'これをください', romaji: 'Kore wo kudasai', meaning: '이것을 주세요' },
                { japanese: 'トイレはどこですか', romaji: 'Toire wa doko desu ka', meaning: '화장실은 어디입니까?' },
                { japanese: '写真を撮ってもいいですか', romaji: 'Shashin wo totte mo ii desu ka', meaning: '사진을 찍어도 될까요?' },
                { japanese: '予約をお願いします', romaji: 'Yoyaku wo onegaishimasu', meaning: '예약을 부탁합니다' },
                { japanese: 'チェックインお願いします', romaji: 'Chekkuin onegaishimasu', meaning: '체크인 부탁합니다' },
                { japanese: '助けてください', romaji: 'Tasukete kudasai', meaning: '도와주세요' }
            ],
            food: [
                { japanese: 'おいしい', romaji: 'Oishii', meaning: '맛있다' },
                { japanese: 'お水をください', romaji: 'Omizu wo kudasai', meaning: '물 주세요' },
                { japanese: 'お会計お願いします', romaji: 'Okaikei onegaishimasu', meaning: '계산 부탁합니다' },
                { japanese: 'ラーメンをください', romaji: 'Raamen wo kudasai', meaning: '라면 주세요' },
                { japanese: '寿司が好きです', romaji: 'Sushi ga suki desu', meaning: '초밥을 좋아합니다' },
                { japanese: 'ごちそうさまでした', romaji: 'Gochisousama deshita', meaning: '잘 먹었습니다' },
                { japanese: 'メニューを見せてください', romaji: 'Menyuu wo misete kudasai', meaning: '메뉴를 보여주세요' },
                { japanese: 'おすすめは何ですか', romaji: 'Osusume wa nan desu ka', meaning: '추천은 무엇입니까?' }
            ]
        };

        // State
        let currentCategory = 'greetings';
        let currentIndex = 0;
        let recognition = null;
        let isRecording = false;

        // DOM Elements
        const japaneseText = document.getElementById('japaneseText');
        const romajiText = document.getElementById('romajiText');
        const meaningText = document.getElementById('meaningText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const recordBtn = document.getElementById('recordBtn');
        const recordStatus = document.getElementById('recordStatus');
        const resultText = document.getElementById('resultText');
        const feedbackSection = document.getElementById('feedbackSection');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const customInput = document.getElementById('customInput');
        const customBtn = document.getElementById('customBtn');
        const progressText = document.getElementById('progressText');
        const errorMessage = document.getElementById('errorMessage');
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
            } else if ('SpeechRecognition' in window) {
                recognition = new SpeechRecognition();
            } else {
                showError('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해주세요.');
                return false;
            }

            recognition.lang = 'ja-JP';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordStatus.textContent = '듣고 있습니다...';
                recordStatus.classList.add('recording');
                resultText.textContent = '...';
                resultText.className = 'result-text';
                feedbackSection.style.display = 'none';
            };

            recognition.onend = () => {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordStatus.textContent = '버튼을 누르고 발음하세요';
                recordStatus.classList.remove('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const confidence = event.results[0][0].confidence;
                resultText.textContent = transcript;
                checkPronunciation(transcript);
            };

            recognition.onerror = (event) => {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordStatus.classList.remove('recording');

                if (event.error === 'no-speech') {
                    recordStatus.textContent = '음성이 감지되지 않았습니다. 다시 시도해주세요.';
                } else if (event.error === 'audio-capture') {
                    showError('마이크를 찾을 수 없습니다. 마이크 연결을 확인해주세요.');
                } else if (event.error === 'not-allowed') {
                    showError('마이크 접근이 거부되었습니다. 브라우저 설정에서 마이크 권한을 허용해주세요.');
                } else {
                    recordStatus.textContent = '오류가 발생했습니다. 다시 시도해주세요.';
                }
            };

            return true;
        }

        // Check pronunciation
        function checkPronunciation(transcript) {
            const currentSentence = sentences[currentCategory][currentIndex];
            const target = currentSentence.japanese;

            // Normalize strings for comparison
            const normalizedTranscript = normalizeJapanese(transcript);
            const normalizedTarget = normalizeJapanese(target);

            if (normalizedTranscript === normalizedTarget) {
                // Perfect match
                resultText.classList.add('success');
                showFeedback('success', '완벽합니다!', '정확하게 발음했습니다!');
            } else if (calculateSimilarity(normalizedTranscript, normalizedTarget) > 0.6) {
                // Partial match
                resultText.classList.add('partial');
                showFeedback('partial', '거의 맞았어요!', '조금만 더 연습해보세요.');
            } else {
                // No match
                resultText.classList.add('error');
                showFeedback('error', '다시 도전!', '천천히 다시 발음해보세요.');
            }
        }

        // Normalize Japanese text
        function normalizeJapanese(text) {
            return text
                .replace(/\s+/g, '')
                .replace(/[ー]/g, '')
                .toLowerCase();
        }

        // Calculate string similarity
        function calculateSimilarity(str1, str2) {
            const longer = str1.length > str2.length ? str1 : str2;
            const shorter = str1.length > str2.length ? str2 : str1;

            if (longer.length === 0) return 1.0;

            const editDistance = getEditDistance(longer, shorter);
            return (longer.length - editDistance) / longer.length;
        }

        // Levenshtein distance
        function getEditDistance(str1, str2) {
            const matrix = [];

            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }

            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }

            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }

            return matrix[str2.length][str1.length];
        }

        // Show feedback
        function showFeedback(type, icon, text) {
            feedbackSection.className = `feedback-section ${type}`;
            feedbackSection.style.display = 'block';

            if (type === 'success') {
                feedbackIcon.textContent = '🎉';
            } else if (type === 'partial') {
                feedbackIcon.textContent = '👍';
            } else {
                feedbackIcon.textContent = '💪';
            }

            feedbackText.textContent = text;
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Update display
        function updateDisplay() {
            const currentSentence = sentences[currentCategory][currentIndex];
            japaneseText.textContent = currentSentence.japanese;
            romajiText.textContent = currentSentence.romaji;
            meaningText.textContent = currentSentence.meaning;
            progressText.textContent = `문장 ${currentIndex + 1} / ${sentences[currentCategory].length}`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === sentences[currentCategory].length - 1;

            // Reset result
            resultText.textContent = '-';
            resultText.className = 'result-text';
            feedbackSection.style.display = 'none';
        }

        // Event Listeners
        recordBtn.addEventListener('click', () => {
            if (!recognition) {
                if (!initSpeechRecognition()) return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < sentences[currentCategory].length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                currentIndex = 0;
                updateDisplay();
            });
        });

        customBtn.addEventListener('click', () => {
            const customText = customInput.value.trim();
            if (customText) {
                // Add custom sentence temporarily
                sentences[currentCategory].push({
                    japanese: customText,
                    romaji: '(사용자 입력)',
                    meaning: '사용자가 입력한 문장'
                });
                currentIndex = sentences[currentCategory].length - 1;
                updateDisplay();
                customInput.value = '';
            }
        });

        customInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                customBtn.click();
            }
        });

        // Initialize
        if (initSpeechRecognition()) {
            updateDisplay();
        }
    </script>
</body>
</html>
