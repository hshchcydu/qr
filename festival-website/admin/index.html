<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>축제 관리 도구 - Festival Admin Panel</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🎪 관리 도구</h1>
                <p>Festival Admin</p>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-section="festival">
                    <span class="icon">🎉</span>
                    <span>기본 정보</span>
                </button>
                <button class="nav-btn" data-section="hero">
                    <span class="icon">🌟</span>
                    <span>메인 화면</span>
                </button>
                <button class="nav-btn" data-section="schedule">
                    <span class="icon">📅</span>
                    <span>일정 관리</span>
                </button>
                <button class="nav-btn" data-section="news">
                    <span class="icon">📰</span>
                    <span>소식 관리</span>
                </button>
                <button class="nav-btn" data-section="about">
                    <span class="icon">ℹ️</span>
                    <span>소개 관리</span>
                </button>
                <button class="nav-btn" data-section="weather">
                    <span class="icon">🌤️</span>
                    <span>날씨 정보</span>
                </button>
                <button class="nav-btn" data-section="gallery">
                    <span class="icon">🖼️</span>
                    <span>갤러리</span>
                </button>
                <button class="nav-btn" data-section="social">
                    <span class="icon">📱</span>
                    <span>소셜 미디어</span>
                </button>
                <button class="nav-btn" data-section="footer">
                    <span class="icon">📋</span>
                    <span>푸터 정보</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-primary" id="saveBtn">
                    💾 저장하기
                </button>
                <button class="btn btn-secondary" id="previewBtn">
                    👁️ 미리보기
                </button>
                <button class="btn btn-export" id="exportBtn">
                    📥 내보내기
                </button>
                <button class="btn btn-import" id="importBtn">
                    📤 가져오기
                </button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h2 id="sectionTitle">기본 정보</h2>
                <div class="header-actions">
                    <span class="save-status" id="saveStatus">저장됨</span>
                </div>
            </div>

            <!-- Festival Section -->
            <div class="content-section active" id="section-festival">
                <div class="form-group">
                    <label for="festivalName">축제 이름 (한국어)</label>
                    <input type="text" id="festivalName" placeholder="예: 나의 축제">
                </div>
                <div class="form-group">
                    <label for="festivalNameEn">축제 이름 (영어)</label>
                    <input type="text" id="festivalNameEn" placeholder="예: My Festival">
                </div>
                <div class="form-group">
                    <label for="festivalTagline">태그라인</label>
                    <input type="text" id="festivalTagline" placeholder="예: 당신을 위한 특별한 축제">
                </div>
                <div class="form-group">
                    <label for="festivalYear">연도</label>
                    <input type="text" id="festivalYear" placeholder="2026">
                </div>
            </div>

            <!-- Hero Section -->
            <div class="content-section" id="section-hero">
                <div class="form-group">
                    <label for="heroTitle">메인 타이틀</label>
                    <input type="text" id="heroTitle" placeholder="예: 나의 축제 2026">
                </div>
                <div class="form-group">
                    <label for="heroSubtitle">서브 타이틀</label>
                    <input type="text" id="heroSubtitle" placeholder="예: 함께 만드는 특별한 순간">
                </div>
                <div class="form-group">
                    <label for="heroScrollText">스크롤 텍스트</label>
                    <input type="text" id="heroScrollText" placeholder="스크롤">
                </div>
            </div>

            <!-- Schedule Section -->
            <div class="content-section" id="section-schedule">
                <div class="form-group">
                    <label for="scheduleDates">축제 기간</label>
                    <input type="text" id="scheduleDates" placeholder="2026년 2월 4일(수) ~ 2월 11일(수)">
                </div>
                <div class="section-header">
                    <h3>회장 정보</h3>
                    <button class="btn btn-small" id="addVenueBtn">+ 회장 추가</button>
                </div>
                <div id="venuesList" class="items-list"></div>
            </div>

            <!-- News Section -->
            <div class="content-section" id="section-news">
                <div class="section-header">
                    <h3>소식 관리</h3>
                    <button class="btn btn-small" id="addNewsBtn">+ 소식 추가</button>
                </div>
                <div id="newsList" class="items-list"></div>
            </div>

            <!-- About Section -->
            <div class="content-section" id="section-about">
                <div class="section-header">
                    <h3>소개 섹션</h3>
                    <button class="btn btn-small" id="addAboutBtn">+ 섹션 추가</button>
                </div>
                <div id="aboutList" class="items-list"></div>
            </div>

            <!-- Weather Section -->
            <div class="content-section" id="section-weather">
                <div class="form-group">
                    <label for="weatherTitle">날씨 타이틀</label>
                    <input type="text" id="weatherTitle" placeholder="날씨 정보">
                </div>
                <div class="form-group">
                    <label for="weatherDescription">날씨 설명</label>
                    <textarea id="weatherDescription" rows="3" placeholder="축제 기간 평균 기온은 5-10도입니다."></textarea>
                </div>
                <div class="section-header">
                    <h3>추천 사항</h3>
                    <button class="btn btn-small" id="addWeatherRecBtn">+ 추천 추가</button>
                </div>
                <div id="weatherRecList" class="items-list"></div>
            </div>

            <!-- Gallery Section -->
            <div class="content-section" id="section-gallery">
                <div class="section-header">
                    <h3>갤러리 이미지</h3>
                    <button class="btn btn-small" id="addGalleryBtn">+ 이미지 추가</button>
                </div>
                <div id="galleryList" class="items-list"></div>
            </div>

            <!-- Social Section -->
            <div class="content-section" id="section-social">
                <div class="form-group">
                    <label for="socialTwitter">Twitter URL</label>
                    <input type="url" id="socialTwitter" placeholder="https://twitter.com/yourfestival">
                </div>
                <div class="form-group">
                    <label for="socialInstagram">Instagram URL</label>
                    <input type="url" id="socialInstagram" placeholder="https://instagram.com/yourfestival">
                </div>
                <div class="form-group">
                    <label for="socialFacebook">Facebook URL</label>
                    <input type="url" id="socialFacebook" placeholder="https://facebook.com/yourfestival">
                </div>
                <div class="form-group">
                    <label for="socialYoutube">YouTube URL</label>
                    <input type="url" id="socialYoutube" placeholder="https://youtube.com/@yourfestival">
                </div>
            </div>

            <!-- Footer Section -->
            <div class="content-section" id="section-footer">
                <div class="form-group">
                    <label for="footerOrgName">조직 이름</label>
                    <input type="text" id="footerOrgName" placeholder="축제 조직위원회">
                </div>
                <div class="form-group">
                    <label for="footerAddress">주소</label>
                    <input type="text" id="footerAddress" placeholder="서울특별시 종로구 세종대로 123">
                </div>
                <div class="form-group">
                    <label for="footerPhone">전화번호</label>
                    <input type="tel" id="footerPhone" placeholder="02-1234-5678">
                </div>
                <div class="form-group">
                    <label for="footerEmail">이메일</label>
                    <input type="email" id="footerEmail" placeholder="info@yourfestival.com">
                </div>
                <div class="form-group">
                    <label for="footerCopyright">저작권 정보</label>
                    <input type="text" id="footerCopyright" placeholder="© 2026 Your Festival. All rights reserved.">
                </div>
                <div class="section-header">
                    <h3>푸터 링크</h3>
                    <button class="btn btn-small" id="addFooterLinkBtn">+ 링크 추가</button>
                </div>
                <div id="footerLinksList" class="items-list"></div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">확인</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">취소</button>
                <button class="btn btn-primary" id="modalConfirm">확인</button>
            </div>
        </div>
    </div>

    <script src="admin-app.js"></script>
</body>
</html>
